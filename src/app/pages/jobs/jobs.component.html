<!-- Generated from the Site Blueprint. Edit the blueprint, not this file. -->
<main class="page page--jobs">
  <!-- Header -->
  <app-section
    type="nav"
    sectionId="jobs-header"
    label="Header"
    [content]='{"showLogo":"true","sticky":"true"}'
  ></app-section>

  <!-- Filters and results -->
  <div class="layout layout--row layout-jobs--jobs-layout" style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 32px; align-items: flex-start; justify-content: flex-start; padding: 32px; max-width: 1240px; margin-inline: auto">
    <!-- Filter jobs -->
    <lib-facets
      label="Filter roles"
      [isClearAll]="true"
      style="flex: 0 1 300px; min-width: 0"
    ></lib-facets>

    <!-- Search and results -->
    <div class="layout layout--column layout-jobs--jobs-results" style="display: flex; flex-direction: column; gap: 16px; align-items: stretch; justify-content: flex-start; flex: 1 1 0%; min-width: 0">
      <!-- Search jobs -->
      <lib-zm-search
        placeholder="Search by title, skill or location"
        [showSearchButton]="true"
        appearance="outline"
      ></lib-zm-search>

      <!-- Applied filters -->
      <lib-filter-chips></lib-filter-chips>

      <!-- Open roles -->
      <lib-jobs-list
        applyBtnText="View role"
        [cardClickable]="true"
        [chipsViewForSkills]="true"
        (jobURL)="openJob($event)"
      ></lib-jobs-list>

      <!-- Page through results -->
      <lib-pagination
        [currentPage]="1"
      ></lib-pagination>
    </div>
  </div>

  <!-- Footer -->
  <app-section
    type="footer"
    sectionId="jobs-footer"
    label="Footer"
    [content]='{"legal":"© 2026 Zwayam. All rights reserved."}'
  ></app-section>
</main>
