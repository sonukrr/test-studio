<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="Photo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.78"/>
    </linearGradient>
    <pattern id="p" width="43" height="43" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="43" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
