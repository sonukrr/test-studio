  <text x="50%" y="50%" fill="#FFFFFF" fill-opacity="0.82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="0.02em" text-anchor="middle" dominant-baseline="middle">Photo</text>
